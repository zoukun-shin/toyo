_schema-version: "3.2"
ID: co01
description: UI5 Application for CO
version: 0.0.1
modules:
- name: co01-destination-content
  type: com.sap.application.content
  requires:
  - name: co01-destination-service
    parameters:
      content-target: true
  - name: co01-repo-host
    parameters:
      service-key:
        name: co01-repo-host-key
  - name: co01-auth
    parameters:
      service-key:
        name: co01-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: co01_html_repo_host
          ServiceInstanceName: co01-html5-service
          ServiceKeyName: co01-repo-host-key
          sap.cloud.service: co01
        - Authentication: OAuth2UserTokenExchange
          Name: co01_auth
          ServiceInstanceName: co01-xsuaa-service
          ServiceKeyName: co01-auth-key
          sap.cloud.service: co01
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: co01-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: co01-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - costandardcost.zip
      name: costandardcost
      target-path: resources/
    - artifacts:
      - cobackflashdiffprocess.zip
      name: cobackflashdiffprocess
      target-path: resources/
- name: costandardcost
  type: html5
  path: standardcost
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: cobackflashdiffprocess
  type: html5
  path: backflashdiffprocess
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: co01-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: co01-destination-service
    service-plan: lite
- name: co01-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: co01-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-name: co01-xsuaa-service
    service-plan: application
- name: co01-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: co01-html5-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
