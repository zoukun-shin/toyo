_schema-version: "3.2"
ID: mm01
version: 0.0.1
modules:
- name: mm01-destination-content
  type: com.sap.application.content
  requires:
  - name: mm01-destination-service
    parameters:
      content-target: true
  - name: mm01-repo-host
    parameters:
      service-key:
        name: mm01-repo-host-key
  - name: mm01-uaa
    parameters:
      service-key:
        name: mm01-uaa-key
  parameters:
    content:
      instance:
        destinations:
        - Name: mm01_html_repo_host
          ServiceInstanceName: mm01-html5-service
          ServiceKeyName: mm01-repo-host-key
          sap.cloud.service: mm01
        - Authentication: OAuth2UserTokenExchange
          Name: mm01_uaa
          ServiceInstanceName: mm01-xsuaa-service
          ServiceKeyName: mm01-uaa-key
          sap.cloud.service: mm01
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: mm01-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: mm01-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - mmacceptance.zip
      name: mmacceptance
      target-path: resources/
    - artifacts:
      - mmpoupload.zip
      name: mmpoupload
      target-path: resources/
- name: mmacceptance
  type: html5
  path: acceptance
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: mmpoupload
  type: html5
  path: poupload
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: mm01-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: mm01-destination-service
    service-plan: lite
- name: mm01-uaa
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: mm01-xsuaa-service
    service-plan: application
- name: mm01-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: mm01-html5-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
