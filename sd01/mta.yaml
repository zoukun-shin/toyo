_schema-version: "3.2"
ID: sd01
description: UI5 Application for SD
version: 0.0.1
modules:
- name: sd01-destination-content
  type: com.sap.application.content
  requires:
  - name: sd01-destination-service
    parameters:
      content-target: true
  - name: sd01-repo-host
    parameters:
      service-key:
        name: sd01-repo-host-key
  - name: sd01-auth
    parameters:
      service-key:
        name: sd01-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: sd01_html_repo_host
          ServiceInstanceName: sd01-html5-service
          ServiceKeyName: sd01-repo-host-key
          sap.cloud.service: sd01
        - Authentication: OAuth2UserTokenExchange
          Name: sd01_auth
          ServiceInstanceName: sd01-xsuaa-service
          ServiceKeyName: sd01-auth-key
          sap.cloud.service: sd01
        existing_destinations_policy: update
  build-parameters:
    no-source: true
resources:
- name: sd01-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: sd01-destination-service
    service-plan: lite
- name: sd01-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: sd01-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-name: sd01-xsuaa-service
    service-plan: application
- name: sd01-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: sd01-html5-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
